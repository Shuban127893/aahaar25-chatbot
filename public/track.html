<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Delivery | AAHAAR25</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --surface: #ffffff;
      --surface-soft: #fffaf2;
      --orange-500: #f1841f;
      --orange-600: #e06a0d;
      --green-600: #1f8a4c;
      --text: #352116;
      --muted: #756558;
      --border: #eadfce;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: var(--surface-soft);
      color: var(--text);
    }

    .header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header h1 {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 17px;
      margin: 0;
    }

    /*
    The hero card is the whole point of this
    redesign - one glance answers "where's my
    food," the same way a transit app leads
    with "bus arrives in 6 min" instead of a
    list of stops.
    */
    .hero {
      padding: 22px 20px 24px;
      background: linear-gradient(135deg, var(--orange-600), var(--orange-500));
      color: #ffffff;
      text-align: center;
    }

    .hero-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 6px;
    }

    .hero-big {
      font-family: 'Manrope', sans-serif;
      font-weight: 900;
      font-size: 40px;
      line-height: 1.05;
      margin-bottom: 4px;
    }

    .hero-big small {
      font-size: 18px;
      font-weight: 700;
    }

    .hero-sub {
      font-size: 13px;
      opacity: 0.92;
    }

    .hero-sub strong {
      font-weight: 700;
    }

    .hero.no-eta .hero-big {
      font-size: 22px;
    }

    #map {
      height: 44vh;
      width: 100%;
    }

    /*
    The default OpenStreetMap tile style is
    built for cartographers - lots of colored
    highway shields and minor-road lines that
    just read as clutter to a customer glancing
    at a delivery map. This filter mutes that
    noise (desaturates the busy reds/oranges,
    lightens the overall tile) without switching
    tile providers or needing any new API key.
    */
    .leaflet-tile-pane {
      filter: grayscale(0.45) brightness(1.08) contrast(0.9) saturate(0.85);
    }

    /*
    Markers sit in a different pane than the
    tiles, so this filter never touches the
    driver dot or stop markers - only the
    underlying map graphic gets muted.
    */

    .panel {
      padding: 16px 20px 40px;
      max-width: 640px;
      margin: 0 auto;
    }

    .freshness {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-600);
      flex-shrink: 0;
    }

    .dot.stale {
      background: #c97a2b;
    }

    .stop-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .stop-row:last-child {
      border-bottom: none;
    }

    .stop-row.is-next {
      background: #fff7ec;
      margin: 0 -12px;
      padding: 13px 12px;
      border-radius: 12px;
      border-bottom: none;
    }

    .stop-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    .stop-icon.delivered {
      background: #e5f3ea;
      color: var(--green-600);
    }

    .stop-icon.pending {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .stop-icon.next {
      background: var(--orange-500);
      color: #ffffff;
      border: none;
    }

    .stop-name {
      font-weight: 600;
      font-size: 14px;
    }

    .stop-time {
      font-size: 12px;
      color: var(--muted);
    }

    .stop-right {
      margin-left: auto;
      text-align: right;
    }

    .stop-eta {
      font-size: 13px;
      font-weight: 700;
      color: var(--orange-600);
    }

    .stop-status {
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
      color: var(--muted);
    }

    .stop-status.delivered { color: var(--green-600); }

    .error-box {
      background: #fff0e8;
      border: 1px solid #f4c98a;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍱 AAHAAR25 Delivery Tracker</h1>
  </div>

  <div id="hero" class="hero no-eta">
    <div class="hero-eyebrow" id="heroEyebrow">Loading today's route...</div>
    <div class="hero-big" id="heroBig">—</div>
    <div class="hero-sub" id="heroSub"></div>
  </div>

  <div id="map"></div>

  <div class="panel">
    <div class="freshness">
      <div class="dot" id="freshnessDot"></div>
      <span id="freshnessText">Checking driver location...</span>
    </div>

    <div id="stopsList"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const day = params.get("day") || "";
    const date = params.get("date") || "";
    const token = params.get("token") || "";

    let map = null;
    let driverMarkers = {};
    let stopMarkers = {};

    function initMap() {
      map = L.map("map", { zoomControl: true }).setView([35.2271, -80.8431], 13); // Charlotte, NC default

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      }).addTo(map);
    }

    const driverIcon = L.divIcon({
      className: "",
      html: '<div style="background:#f1841f;width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.35);"></div>',
      iconSize: [24, 24]
    });

    const stopIcon = L.divIcon({
      className: "",
      html: '<div style="background:#176b45;width:15px;height:15px;border-radius:4px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>',
      iconSize: [15, 15]
    });

    const nextStopIcon = L.divIcon({
      className: "",
      html: '<div style="background:#f1841f;width:19px;height:19px;border-radius:4px;border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.35);"></div>',
      iconSize: [19, 19]
    });

    function timeAgo(isoString) {
      const seconds = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
      if (seconds < 60) return "just now";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} min ago`;
      return `${Math.floor(minutes / 60)} hr ago`;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value);
      return div.innerHTML;
    }

    function renderHero(nextStop, driversWithLocation) {
      const hero = document.getElementById("hero");
      const eyebrow = document.getElementById("heroEyebrow");
      const big = document.getElementById("heroBig");
      const sub = document.getElementById("heroSub");

      if (!nextStop) {
        hero.classList.add("no-eta");
        eyebrow.textContent = "All done";
        big.textContent = "Delivered";
        sub.textContent = "Every stop on today's route has been completed.";
        return;
      }

      if (
        nextStop.etaMinutes == null ||
        driversWithLocation.length === 0
      ) {
        hero.classList.add("no-eta");
        eyebrow.textContent = `Next stop: ${nextStop.location}`;
        big.textContent = "Waiting for driver location";
        sub.textContent = "This updates automatically once your driver shares their location.";
        return;
      }

      hero.classList.remove("no-eta");
      eyebrow.textContent = `Heading to ${nextStop.location}`;

      big.innerHTML =
        `${nextStop.etaMinutes} <small>min away</small>`;

      const distanceText =
        nextStop.distanceMiles != null
          ? `${nextStop.distanceMiles} mi away`
          : "";

      sub.innerHTML =
        `<strong>${escapeHtml(nextStop.driverName || "Your driver")}</strong>` +
        (distanceText ? ` &middot; ${escapeHtml(distanceText)}` : "");
    }

    async function refresh() {
      try {
        const response = await fetch(
          `/track-data?day=${encodeURIComponent(day)}&date=${encodeURIComponent(date)}&token=${encodeURIComponent(token)}`
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          document.querySelector(".panel").innerHTML =
            `<div class="error-box">This tracking link isn't valid or has expired. Please check WhatsApp for a current link, or contact us at the restaurant.</div>`;
          document.getElementById("hero").innerHTML =
            `<div class="hero-eyebrow">Link expired</div>`;
          return;
        }

        const driversWithLocation = data.drivers.filter((d) => d.hasLocation);

        // The next stop still awaiting delivery,
        // in the order the route sends them.
        const nextStop = data.stops.find(
          (stop) => stop.status !== "delivered"
        );

        renderHero(nextStop, driversWithLocation);

        const freshnessDot = document.getElementById("freshnessDot");
        const freshnessText = document.getElementById("freshnessText");

        if (driversWithLocation.length === 0) {
          freshnessText.textContent = "Driver location isn't available yet - check back shortly.";
          freshnessDot.classList.add("stale");
        } else {
          const mostRecent = driversWithLocation
            .slice()
            .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];

          const isStale =
            Date.now() - new Date(mostRecent.updatedAt).getTime() > 5 * 60 * 1000;

          freshnessDot.classList.toggle("stale", isStale);

          freshnessText.textContent = isStale
            ? `Last seen ${timeAgo(mostRecent.updatedAt)} - location may not be current`
            : `Driver location updated ${timeAgo(mostRecent.updatedAt)}`;
        }

        if (map) {
          const bounds = [];

          driversWithLocation.forEach((driver) => {
            const latLng = [driver.latitude, driver.longitude];
            bounds.push(latLng);

            if (driverMarkers[driver.id]) {
              driverMarkers[driver.id].setLatLng(latLng);
            } else {
              driverMarkers[driver.id] = L.marker(latLng, { icon: driverIcon })
                .addTo(map)
                .bindPopup(escapeHtml(driver.name));
            }
          });

          const stopBounds = [];

          data.stops.forEach((stop) => {
            if (
              stop.latitude == null ||
              stop.longitude == null
            ) {
              return;
            }

            const latLng = [stop.latitude, stop.longitude];
            stopBounds.push(latLng);

            const isNext =
              nextStop && stop.location === nextStop.location;

            const icon = isNext ? nextStopIcon : stopIcon;

            const popupHtml =
              `${escapeHtml(stop.location)}<br><small>${escapeHtml(stop.time)}</small>` +
              (stop.etaMinutes != null
                ? `<br><small>${stop.etaMinutes} min away</small>`
                : "");

            if (stopMarkers[stop.location]) {
              stopMarkers[stop.location].setLatLng(latLng);
              stopMarkers[stop.location].setIcon(icon);
              stopMarkers[stop.location].setPopupContent(popupHtml);
            } else {
              stopMarkers[stop.location] = L.marker(latLng, { icon })
                .addTo(map)
                .bindPopup(popupHtml);
            }
          });

          const allBounds = bounds.concat(stopBounds);

          if (allBounds.length > 0) {
            map.fitBounds(allBounds, { maxZoom: 14, padding: [40, 40] });
          }
        }

        const stopsList = document.getElementById("stopsList");

        stopsList.innerHTML = data.stops
          .map((stop) => {
            const delivered = stop.status === "delivered";
            const isNext = nextStop && stop.location === nextStop.location;

            const iconClass = delivered
              ? "delivered"
              : isNext
                ? "next"
                : "pending";

            const iconGlyph = delivered
              ? "fa-check"
              : isNext
                ? "fa-truck-fast"
                : "fa-clock";

            let rightHtml;

            if (delivered) {
              rightHtml = `<div class="stop-status delivered">Delivered</div>`;
            } else if (stop.etaMinutes != null) {
              rightHtml =
                `<div class="stop-eta">${stop.etaMinutes} min</div>` +
                `<div class="stop-status">${stop.distanceMiles != null ? stop.distanceMiles + " mi" : "Upcoming"}</div>`;
            } else {
              rightHtml = `<div class="stop-status">Upcoming</div>`;
            }

            return `
              <div class="stop-row ${isNext ? "is-next" : ""}">
                <div class="stop-icon ${iconClass}">
                  <i class="fa-solid ${iconGlyph}"></i>
                </div>
                <div>
                  <div class="stop-name">${escapeHtml(stop.location)}</div>
                  <div class="stop-time">${escapeHtml(stop.time)}</div>
                </div>
                <div class="stop-right">
                  ${rightHtml}
                </div>
              </div>
            `;
          })
          .join("");
      } catch (error) {
        document.getElementById("freshnessText").textContent =
          "Couldn't load tracking data. Retrying...";
      }
    }

    initMap();
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
